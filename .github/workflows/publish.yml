# .github/workflows/publish.yml
# 自定义的GitHub Actions 工作流
name: DeepSeek Build & Publish

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '_site/**' # 忽略构建产物

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史，用于恢复文件时间戳

      # 根据 Git 提交历史恢复文件的修改时间
      - name: Restore file timestamps
        run: |
          git ls-files -z | while IFS= read -r -d '' file; do
            time=$(git log -1 --format='%ci' -- "$file" 2>/dev/null)
            if [ -n "$time" ]; then
              touch -d "$time" "$file" 2>/dev/null || true
            fi
          done

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip' # 优化：开启 pip 缓存

      - name: Install Dependencies
        run: pip install -r requirements.txt

      # 尝试从缓存中恢复 TinyTeX
      # 这样可以避免每次都下载LaTeX 引擎
      - name: Cache TinyTeX
        uses: actions/cache@v4
        id: cache-tinytex
        with:
          path: ~/.TinyTeX
          key: tinytex-${{ runner.os }}-v1

      # 安装 Quarto (注意：tinytex 设为 false，由我们手动控制缓存)
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: false 

      # 如果没命中缓存，则安装 TinyTeX
      - name: Install TinyTeX (if not cached)
        if: steps.cache-tinytex.outputs.cache-hit != 'true'
        run: quarto install tinytex --update-path --quiet

      # 将 TinyTeX 的二进制路径加入系统环境，确保 Quarto 能找到它生成 PDF
      # 对于 Ubuntu 系统，路径通常如下：
      - name: Add TinyTeX to PATH
        run: echo "$HOME/.TinyTeX/bin/x86_64-linux" >> $GITHUB_PATH

      # 运行 DeepSeek 翻译
      - name: Run DeepSeek Sync
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/sync_deepseek.py

      # 显式渲染
      # 此时 Quarto 会根据 geometry/papersize 等参数调用 TinyTeX 生成 PDF
      - name: Render Site (Build HTML & PDF)
        run: quarto render

      # 提交翻译结果和缓存
      - name: Commit Translated Files and Freeze Cache
        run: |
          git config --global user.name 'DeepSeek Bot'
          git config --global user.email 'bot@deepseek.com'
          git add content/ _freeze/
          git diff --quiet && git diff --staged --quiet || \
          git commit -m "Auto-translation & Update Freeze Cache [skip ci]" && \
          git push

      # 发布到 GitHub Pages
      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}