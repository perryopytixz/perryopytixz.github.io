# .github/workflows/publish.yml
# 自定义的GitHub Actions 工作流
name: DeepSeek Build & Publish

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '_site/**' # 忽略构建产物

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史，用于恢复文件时间戳

      # 根据 Git 提交历史恢复文件的修改时间
      # 这样 date: last-modified 就能正确显示文件的真实最后修改时间
      - name: Restore file timestamps
        run: |
          git ls-files -z | while IFS= read -r -d '' file; do
            time=$(git log -1 --format='%ci' -- "$file" 2>/dev/null)
            if [ -n "$time" ]; then
              touch -d "$time" "$file" 2>/dev/null || true
            fi
          done

      # 开启 pip 缓存
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      # TinyTeX 相关内容已取消，改为手动上传PDF文件
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: false 

      # 运行 DeepSeek 翻译
      - name: Run DeepSeek Sync
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/sync_deepseek.py

      # 渲染网站
      - name: Render Site
        run: quarto render

      # 提交逻辑
      # 同时保存翻译结果(content) 和 计算缓存(_freeze)
      - name: Commit Changes
        run: |
          git config --global user.name 'DeepSeek Bot'
          git config --global user.email 'bot@deepseek.com'
          
          # 安全添加：先检查文件夹是否存在，避免报错
          [ -d "content" ] && git add content/
          [ -d "_freeze" ] && git add _freeze/
          
          # 只有检测到变动才提交，防止死循环
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Auto: Update content & cache [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi

      # 直接发布
      # render: false 直接发布上面生成的 _site
      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false 
          path: _site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}